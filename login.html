<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peony SMM - Login / Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl">
        <h1 class="text-2xl font-bold text-pink-600 text-center mb-6">🌸 Peony Autoplug Portal</h1>
        
        <!-- Tabs para sa Login at Register -->
        <div class="flex border-b mb-6">
            <button onclick="switchTab('login')" id="tab-login" class="flex-1 pb-2 font-bold text-pink-600 border-b-2 border-pink-600">Login</button>
            <button onclick="switchTab('register')" id="tab-register" class="flex-1 pb-2 font-bold text-gray-400">Register</button>
        </div>

        <!-- Form Container -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number / ID</label>
                <input type="text" id="phone" class="w-full p-3 border rounded-xl" placeholder="Hal: 09123456789">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full p-3 border rounded-xl" placeholder="********">
            </div>
            <button id="action-btn" onclick="handleSubmit()" class="w-full bg-pink-600 text-white p-3 rounded-xl font-bold hover:bg-pink-700 transition">Mag-log in</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://telegram-autoplugs.onrender.com";
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');
            const btn = document.getElementById('action-btn');

            if(mode === 'login') {
                loginTab.className = "flex-1 pb-2 font-bold text-pink-600 border-b-2 border-pink-600";
                regTab.className = "flex-1 pb-2 font-bold text-gray-400";
                btn.innerText = "Mag-log in";
            } else {
                regTab.className = "flex-1 pb-2 font-bold text-pink-600 border-b-2 border-pink-600";
                loginTab.className = "flex-1 pb-2 font-bold text-gray-400";
                btn.innerText = "Mag-register";
            }
        }

        async function handleSubmit() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            if(!phone || !password) {
                alert('Paki-punuan ang lahat ng detalye.');
                return;
            }

            const endpoint = currentMode === 'login' ? '/api/login' : '/api/register';

            try {
                const res = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone, password })
                });
                const data = await res.json();

                if(res.ok) {
                    alert(data.message);
                    if(currentMode === 'login') {
                        localStorage.setItem('logged_phone', phone);
                        window.location.href = 'index.html';
                    } else {
                        switchTab('login');
                    }
                } else {
                    alert(data.detail || 'May naganap na error.');
                }
            } catch(e) {
                alert('Hindi makakonekta sa server.');
            }
        }
    </script>
</body>
</html>
