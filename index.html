<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peony SMM - Autoplug Control Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff1f2;
            color: #4c0519;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.15);
            border: 1px solid #fecdd3;
        }
        h2 { 
            text-align: center; 
            color: #e11d48; 
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 12px; 
            color: #9f1239; 
            text-align: center; 
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; color: #881337; }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #fda4af;
            background-color: #fffbfe;
            color: #4c0519;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: #e11d48;
            box-shadow: 0 0 5px rgba(225, 29, 72, 0.2);
        }
        textarea { resize: vertical; height: 70px; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #fb7185, #e11d48);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        #statusMessage {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }
        .logs-container {
            margin-top: 20px;
        }
        .logs-box {
            background-color: #1e1b4b;
            color: #38bdf8;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            height: 150px;
            overflow-y: auto;
            border: 1px solid #fda4af;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .countdown-box {
            display: none;
            text-align: center;
            padding: 20px;
            background: #fff0f5;
            border-radius: 12px;
            border: 2px dashed #fda4af;
            margin-top: 15px;
        }
        .countdown-timer {
            font-size: 2rem;
            color: #e11d48;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Peony Autoplug</h2>
    <div class="subtitle">🔒 Secure String Session Control Panel</div>
    
    <!-- Form Container (Nawawala kapag may active plug) -->
    <div id="formContainer">
        <div class="form-group">
            <label>Client Keycode:</label>
            <input type="text" id="keycodeInput" placeholder="Ilagay ang iyong keycode..." />
        </div>

        <div class="form-group">
            <label>Phone Number (May kasamang +63):</label>
            <input type="text" id="phoneInput" placeholder="+639..." value="+63" />
        </div>

        <div class="form-group">
            <label>Mensahe para sa Autoplug:</label>
            <textarea id="msgInput" placeholder="Ilagay ang mensahe dito..."></textarea>
        </div>

        <div class="form-group">
            <label>Mga Grupo (Isang username/link kada linya):</label>
            <textarea id="groupsInput" placeholder="@group1&#10;@group2"></textarea>
        </div>

        <div class="form-group">
            <label>Interval (Minuto kada ikot):</label>
            <input type="number" id="intervalInput" value="35" />
        </div>

        <button onclick="startAutoplug()">Simulan ang Autoplug</button>
        <div id="statusMessage"></div>
    </div>

    <!-- 24-Hour Countdown Container (Lilitaw habang aktibo ang 24 hours) -->
    <div id="countdownContainer" class="countdown-box">
        <h3 style="color: #e11d48; margin-top: 0;">Aktibo ang 24-Oras na Plug!</h3>
        <p style="font-size: 13px; color: #881337; margin-bottom: 5px;">Natitirang oras bago mag-tapos:</p>
        <div id="timerDisplay" class="countdown-timer">24:00:00</div>
        <p style="font-size: 11px; color: #9f1239;">Huwag isara o i-clear ang site; tumatakbo nang tuloy-tuloy ang autoplug.</p>
    </div>

    <div class="logs-container">
        <label>Live Activity Logs:</label>
        <div id="logsBox" class="logs-box">Naghihintay na magsimula ang autoplug...</div>
    </div>
</div>

<script>
let logInterval = null;
let countdownInterval = null;

// Pag-load ng pahina, i-check kung may kasalukuyang active 24-hour session
document.addEventListener("DOMContentLoaded", () => {
    checkActiveSession();
});

function checkActiveSession() {
    const savedEndTime = localStorage.getItem("autoplug_end_time");
    const savedPhone = localStorage.getItem("autoplug_phone");

    if (savedEndTime) {
        const now = new Date().getTime();
        const timeLeft = savedEndTime - now;

        if (timeLeft > 0) {
            // Itago ang form, ipakita ang countdown timer
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('countdownContainer').style.display = 'block';
            startLiveCountdown(timeLeft);

            // Ipagpatuloy ang pagkuha ng logs
            if (savedPhone) {
                if (logInterval) clearInterval(logInterval);
                logInterval = setInterval(() => fetchLogs(savedPhone), 3000);
            }
        } else {
            // Kung lumipas na ang 24 hours, i-reset pabalik sa form
            resetSession();
        }
    }
}

async function startAutoplug() {
    const keycode = document.getElementById('keycodeInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();
    const message = document.getElementById('msgInput').value.trim();
    const groupsRaw = document.getElementById('groupsInput').value;
    const interval_minutes = parseInt(document.getElementById('intervalInput').value);
    const statusDiv = document.getElementById('statusMessage');

    if (!keycode || !phone || !message || !groupsRaw) {
        statusDiv.style.color = '#e11d48';
        statusDiv.innerText = 'Mangyaring punan ang Keycode at lahat ng kinakailangang impormasyon.';
        return;
    }

    const groups = groupsRaw.split('\n').filter(g => g.trim() !== '');

    statusDiv.style.color = '#9f1239';
    statusDiv.innerText = 'Nagsisimulang kumonekta sa Render server...';

    try {
        const response = await fetch('https://telegram-autoplugs.onrender.com/api/start-autoplug', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                keycode: keycode,
                phone: phone,
                message: message,
                groups: groups,
                interval_minutes: interval_minutes
            })
        });

        const data = await response.json();
        
        if (response.ok) {
            statusDiv.style.color = '#047857';
            statusDiv.innerText = data.message || 'Matagumpay na nagsimula ang autoplug!';
            
            // Magtakda ng eksaktong 24 oras (24 * 60 * 60 * 1000 ms)
            const durationMs = 24 * 60 * 60 * 1000;
            const endTime = new Date().getTime() + durationMs;

            // I-save sa localStorage para maging persistent kahit i-refresh
            localStorage.setItem("autoplug_end_time", endTime);
            localStorage.setItem("autoplug_phone", phone);

            // Palitan ang view patungong countdown
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('countdownContainer').style.display = 'block';
            startLiveCountdown(durationMs);

            // Simulan ang awtomatikong pagkuha ng logs kada 3 segundo
            if (logInterval) clearInterval(logInterval);
            logInterval = setInterval(() => fetchLogs(phone), 3000);
        } else {
            statusDiv.style.color = '#e11d48';
            statusDiv.innerText = 'Error: ' + (data.detail || 'Hindi na-proseso ang hiling.');
        }
    } catch (err) {
        statusDiv.style.color = '#e11d48';
        statusDiv.innerText = 'May problema sa koneksyon sa server: ' + err.message;
    }
}

function startLiveCountdown(durationMs) {
    const endTime = new Date().getTime() + durationMs;

    if (countdownInterval) clearInterval(countdownInterval);

    countdownInterval = setInterval(() => {
        const now = new Date().getTime();
        const timeLeft = endTime - now;

        if (timeLeft <= 0) {
            clearInterval(countdownInterval);
            resetSession();
            alert("Natapos na ang 24-oras na autoplug session!");
            return;
        }

        const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

        document.getElementById('timerDisplay').textContent = 
            String(hours).padStart(2, '0') + ":" +
            String(minutes).padStart(2, '0') + ":" +
            String(seconds).padStart(2, '0');
    }, 1000);
}

function resetSession() {
    localStorage.removeItem("autoplug_end_time");
    localStorage.removeItem("autoplug_phone");
    if (logInterval) clearInterval(logInterval);
    if (countdownInterval) clearInterval(countdownInterval);

    // Ibalik ang form para sa bagong client/session
    document.getElementById('countdownContainer').style.display = 'none';
    document.getElementById('formContainer').style.display = 'block';
    document.getElementById('statusMessage').innerText = '';
    document.getElementById('logsBox').innerText = 'Naghihintay na magsimula ang autoplug...';
    
    // I-clear ang mga input
    document.getElementById('keycodeInput').value = '';
    document.getElementById('msgInput').value = '';
    document.getElementById('groupsInput').value = '';
}

async function fetchLogs(phone) {
    try {
        const response = await fetch('https://telegram-autoplugs.onrender.com/api/get-logs', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ phone: phone })
        });

        const data = await response.json();
        if (response.ok && data.logs) {
            const logsBox = document.getElementById('logsBox');
            logsBox.innerText = data.logs.join('\n');
            logsBox.scrollTop = logsBox.scrollHeight;
        }
    } catch (err) {
        console.error("Hindi makuha ang logs:", err);
    }
}
</script>

</body>
</html>
