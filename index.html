<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peony SMM - Autoplug Control Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 80px; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Autoplug Control Panel</h2>
    <p style="font-size: 12px; color: #94a3b8; text-align: center;">Gamit ang Permanent String Session sa Render</p>
    
    <div class="form-group">
        <label>Phone Number (May kasamang +63):</label>
        <input type="text" id="phoneInput" placeholder="+639..." value="+63" />
    </div>

    <div class="form-group">
        <label>Mensahe para sa Autoplug:</label>
        <textarea id="msgInput" placeholder="Ilagay ang mensahe dito..."></textarea>
    </div>

    <div class="form-group">
        <label>Mga Grupo (Isang username/link kada linya):</label>
        <textarea id="groupsInput" placeholder="@group1&#10;@group2"></textarea>
    </div>

    <div class="form-group">
        <label>Interval (Minuto kada ikot):</label>
        <input type="number" id="intervalInput" value="35" />
    </div>

    <button onclick="startAutoplug()">Simulan ang Autoplug</button>
    
    <div id="statusMessage"></div>
</div>

<script>
async function startAutoplug() {
    const phone = document.getElementById('phoneInput').value.trim();
    const message = document.getElementById('msgInput').value.trim();
    const groupsRaw = document.getElementById('groupsInput').value;
    const interval_minutes = parseInt(document.getElementById('intervalInput').value);
    const statusDiv = document.getElementById('statusMessage');

    if (!phone || !message || !groupsRaw) {
        statusDiv.style.color = '#f87171';
        statusDiv.innerText = 'Mangyaring punan ang lahat ng kinakailangang impormasyon.';
        return;
    }

    const groups = groupsRaw.split('\n').filter(g => g.trim() !== '');

    statusDiv.style.color = '#38bdf8';
    statusDiv.innerText = 'Nagsisimulang kumonekta sa Render server...';

    try {
        const response = await fetch('https://telegram-autoplugs.onrender.com/api/start-autoplug', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                phone: phone,
                message: message,
                groups: groups,
                interval_minutes: interval_minutes
            })
        });

        const data = await response.json();
        
        if (response.ok) {
            statusDiv.style.color = '#4ade80';
            statusDiv.innerText = data.message || 'Matagumpay na nagsimula ang autoplug!';
        } else {
            statusDiv.style.color = '#f87171';
            statusDiv.innerText = 'Error: ' + (data.detail || 'Hindi na-proseso ang hiling.');
        }
    } catch (err) {
        statusDiv.style.color = '#f87171';
        statusDiv.innerText = 'May problema sa koneksyon sa server: ' + err.message;
    }
}
</script>

</body>
</html>
